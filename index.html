<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Weather Workspace</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body class="default-bg">

    <div class="weather-container">
        <h2>Weather Forecast 🌤️</h2>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>

        <button id="geo-btn" class="secondary-btn">📍 Use Current Location</button>

        <p id="error-message" class="error hidden"></p>

        <div id="weather-card" class="weather-card hidden">
            <h3 id="location-name">City, Country</h3>
            <div id="weather-icon" class="weather-icon">☀️</div>
            <h1 id="temperature">0°C</h1>
            <p id="description">Clear Sky</p>
            
            <div class="details">
                <div class="detail-item">
                    <span>Humidity:</span>
                    <strong id="humidity">0%</strong>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
